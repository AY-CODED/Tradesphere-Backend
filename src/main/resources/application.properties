server.port=${PORT:8080}
spring.application.name=tradesphere

# MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tradesphere}
spring.data.mongodb.auto-index-creation=true

# JWT Authentication
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://trade-sphere-brown.vercel.app,http://localhost:5173,http://localhost:3000}

# Authentication Cookies
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:None}

# Paystack
paystack.secret-key=${PAYSTACK_SECRET_KEY:}