server.port=${PORT:8080}
spring.application.name=tradesphere

spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://trade-sphere-brown.vercel.app,http://localhost:5173,http://localhost:3000}

auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:None}

paystack.secret-key=${PAYSTACK_SECRET_KEY}